<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320">
  <defs>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE066"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#A67C00"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="0.45" stop-color="#F5D76E"/>
      <stop offset="0.6" stop-color="#C69214"/>
      <stop offset="1" stop-color="#8A5F00"/>
    </linearGradient>
    <linearGradient id="blueV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0D1838"/>
    </linearGradient>
    <filter id="lqshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Vertical diamond emblem -->
  <polygon points="360,18 640,160 360,302 80,160" fill="url(#blueV)" stroke="url(#goldV)" stroke-width="9" stroke-linejoin="round" filter="url(#lqshadow)"/>
  <!-- LIÊN QUÂN wordmark -->
  <text x="360" y="178" text-anchor="middle" font-family="Arial Black, Impact, 'Arial Bold', sans-serif" font-weight="900" font-size="80" fill="url(#goldText)" filter="url(#lqshadow)">LIÊN QUÂN</text>
  <!-- Subtitle -->
  <text x="360" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="5" fill="#E8C55A" filter="url(#lqshadow)">ARENA OF VALOR</text>
</svg>
