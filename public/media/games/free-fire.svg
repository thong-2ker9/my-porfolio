<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- FREE FIRE wordmark: white "FREE" + knife-I (brand amber #FFBA00) + white "RE" -->
  <g font-family="Arial Black, Impact, 'Arial Bold', sans-serif" font-weight="900" font-size="140" fill="#ffffff">
    <text x="46" y="185" filter="url(#shadow)">FREE</text>
    <text x="495.5" y="185" filter="url(#shadow)">F</text>
    <text x="650" y="185" filter="url(#shadow)">RE</text>
  </g>
  <!-- Dagger replacing the letter I (origin = center of the I slot on the baseline) -->
  <g transform="translate(616.5 185)" filter="url(#shadow)">
    <rect x="-15" y="-118" width="30" height="38" rx="7" fill="#3d3d3d"/>
    <rect x="-33" y="-80" width="66" height="16" rx="3" fill="#ffba00"/>
    <polygon points="0,64 -31,-80 31,-80" fill="#ffba00"/>
  </g>
</svg>
